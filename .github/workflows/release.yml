name: Plugin release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout the pinned Core SDK source
        shell: pwsh
        env:
          CORE_REF: 9e401ad2d24b16568d786fc4b2e32311fee60b37
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/YueFChen/Wonderland_Assistant.git core
          git -C core fetch --depth=1 origin $env:CORE_REF
          git -C core checkout --detach $env:CORE_REF

      - uses: actions/checkout@v7
        with:
          path: core/plugins/my_wonderland
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.27.0

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install locked Core UI SDK dependencies
        run: pnpm install --frozen-lockfile
        working-directory: core

      - name: Install locked plugin dependencies
        run: pnpm install --frozen-lockfile
        working-directory: core/plugins/my_wonderland

      - name: Check plugin UI (typecheck / tests / build)
        run: pnpm run check
        working-directory: core/plugins/my_wonderland

      - name: Check Rust formatting
        run: rustfmt --edition 2024 --check src/lib.rs src/main.rs
        working-directory: core/plugins/my_wonderland

      - name: Run Rust clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
        working-directory: core/plugins/my_wonderland

      - name: Run Rust tests
        run: cargo test --locked
        working-directory: core/plugins/my_wonderland

      - name: Build release package
        run: pnpm build:release
        working-directory: core/plugins/my_wonderland

      - name: Create signed update manifest
        shell: pwsh
        env:
          PLUGIN_UPDATE_SIGNING_KEY: ${{ secrets.PLUGIN_UPDATE_SIGNING_KEY }}
        run: |
          $manifest = Get-Content -Raw 'core/plugins/my_wonderland/package/manifest.json' | ConvertFrom-Json
          $packagePath = "core/plugins/my_wonderland/target/release/$($manifest.id)-$($manifest.version)-windows-$($manifest.platform.architecture).wplug"
          $updatePath = "core/plugins/my_wonderland/target/release/$($manifest.id)-update.json"
          node core/plugins/my_wonderland/scripts/create-update-manifest.mjs `
            core/plugins/my_wonderland/package/manifest.json `
            $packagePath `
            $env:GITHUB_REPOSITORY `
            $env:GITHUB_REF_NAME `
            $updatePath

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -Raw 'core/plugins/my_wonderland/package/manifest.json' | ConvertFrom-Json
          $packagePath = "core/plugins/my_wonderland/target/release/$($manifest.id)-$($manifest.version)-windows-$($manifest.platform.architecture).wplug"
          $updatePath = "core/plugins/my_wonderland/target/release/$($manifest.id)-update.json"
          gh release create $env:GITHUB_REF_NAME $packagePath $updatePath --repo $env:GITHUB_REPOSITORY --title "$($manifest.name) v$($manifest.version)" --generate-notes --verify-tag
