[package]
name = "wonderland-wla-my-wonderland"
authors = ["YueFChen"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `#[instrument]` 展开成 `::tracing::...` 绝对路径。
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ts-rs = { workspace = true, optional = true }
wonderland-plugin-sdk = { version = "0.2.0", path = "../../crates/plugin-sdk" }
wonderland-secret = { path = "../../crates/secret" }
sha2 = "0.10"
base64 = "0.22"

[features]
# 只覆盖本插件的 DTO；内核契约的绑定由 crates/kernel 自己生成。
bindings = ["dep:ts-rs"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[example]]
name = "generate_bindings"
required-features = ["bindings"]

[workspace]
resolver = "3"
members = [
    "."
]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
# 日志门面：内核重新导出宏与 `instrument`，工作区不直连 tracing（ADR-002）。
# `attributes` 是 `instrument` 的来源，显式列出以免被别处的 default-features = false 影响。
tracing = { version = "0.1", features = ["attributes"] }
# 日志实现：只有 crates/logging 使用，插件与其它 crate 不得依赖（ADR-002）。
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
tracing-appender = "0.2"
# 输出层脱敏。
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
